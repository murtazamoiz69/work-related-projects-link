# Sprint planner, with shared editing.
#   site/                    the page (index.html) and plan-ops.mjs, the change rules it shares with the server
#   netlify/functions/plan/  /api/plan, the shared plan in Netlify Blobs
#   netlify/functions/files/ /api/files, attachment files in Netlify Blobs
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
