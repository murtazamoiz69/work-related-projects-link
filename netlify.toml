# The HEAL health data integration document, and nothing else.
#   site/health-integration/        the page (built by health-integration/build_doc_site.py)
#   netlify/functions/field-edits/  /api/field-edits, which stores the saved Useful for values
# The page has one address, /health-integration/. The site root sends visitors there.
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/health-integration/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
