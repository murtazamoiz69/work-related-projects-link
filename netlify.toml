# The HEAL health data pages, and nothing else.
#   site/health-integration-siam/   one page   } both built by health-integration/build_doc_site.py;
#   site/health-integration-nws/    the other  } each keeps its own saved phases
#   netlify/functions/field-edits/  /api/field-edits, which stores the saved phases per page
# The site root and the old address, /health-integration/, both send visitors to the siam page.
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/"
  to = "/health-integration-siam/"
  status = 302

[[redirects]]
  from = "/health-integration"
  to = "/health-integration-siam/"
  status = 302

[[redirects]]
  from = "/health-integration/*"
  to = "/health-integration-siam/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
