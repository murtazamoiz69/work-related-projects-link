<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HEAL Journey Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#ba2747; --crimson-d:#9c1d39; --soft:#ffe9ef; --purple:#7f29a7; --purple-soft:#f3e8fa;
  --ground:#f5f1f2; --dot:#dccfd4; --surface:#ffffff; --raise:#fbf7f8;
  --ink:#1a161a; --body:#4d454a; --muted:#867b81; --line:#ece1e5; --line-2:#f5eef0;
  --edge:#cdbfc5; --gap:#8a6a12; --gap-bg:#fdf3dc; --gap-line:#d9b85c;
  --bubble:#ffffff; --bubble-line:#e9e2e5;
  --shadow:rgba(80,30,50,.09); --float:rgba(60,20,40,.16);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --crimson:#e8567b; --crimson-d:#f0819d; --soft:#3a1f29; --purple:#b177d8; --purple-soft:#2c2035;
  --ground:#141114; --dot:#2e272c; --surface:#1e191d; --raise:#251f24;
  --ink:#f5eff2; --body:#cbbfc6; --muted:#968a91; --line:#332b31; --line-2:#2a2328;
  --edge:#4a4046; --gap:#e0b652; --gap-bg:#342a16; --gap-line:#7a6428;
  --bubble:#251f24; --bubble-line:#3a3137;
  --shadow:rgba(0,0,0,.5); --float:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --crimson:#e8567b; --crimson-d:#f0819d; --soft:#3a1f29; --purple:#b177d8; --purple-soft:#2c2035;
  --ground:#141114; --dot:#2e272c; --surface:#1e191d; --raise:#251f24;
  --ink:#f5eff2; --body:#cbbfc6; --muted:#968a91; --line:#332b31; --line-2:#2a2328;
  --edge:#4a4046; --gap:#e0b652; --gap-bg:#342a16; --gap-line:#7a6428;
  --bubble:#251f24; --bubble-line:#3a3137;
  --shadow:rgba(0,0,0,.5); --float:rgba(0,0,0,.55);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ground);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5}
button:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}

/* ------------------------------------------------------------- floaters */
.float{position:fixed;z-index:10;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 32px var(--float)}

.title{top:16px;left:16px;width:min(390px,calc(100vw - 32px));padding:14px 16px}
.eyebrow{font:800 10px 'Inter',sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:var(--crimson);margin:0 0 4px}
h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.title p.how{margin:6px 0 0;font-size:12.5px;color:var(--body)}
.stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.stat{background:var(--raise);border-radius:9px;padding:5px 9px;font:600 11px 'Inter',sans-serif;
  color:var(--muted)}
.stat b{font:800 14px 'Plus Jakarta Sans',sans-serif;color:var(--ink);margin-right:4px}

/* the message panel floats on the right */
#panel{top:16px;right:16px;bottom:16px;width:390px;padding:0;display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.7,.2,1), opacity .2s}
#panel.closed{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
#panel .ph{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 0}
#panel .ph .k{flex:1;font:800 10px 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;
  color:var(--crimson);padding-top:6px}
#panel .x{border:1px solid var(--line);background:var(--raise);color:var(--body);border-radius:9px;
  width:30px;height:30px;cursor:pointer;font:700 15px/1 'Inter',sans-serif;flex:0 0 30px}
#panel .x:hover{border-color:var(--crimson);color:var(--crimson)}
#panel .pb{overflow:auto;padding:4px 18px 20px;flex:1;overscroll-behavior:contain}
#panel h2{margin:2px 0 2px;font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
#panel .when{font:600 12.5px 'Inter',sans-serif;color:var(--muted)}
#panel h3{margin:16px 0 6px;font:800 10.5px 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted)}
#panel p{margin:0;color:var(--body)}
#panel ul{margin:0;padding-left:18px;color:var(--body)}
#panel li{margin:3px 0}
.chip{display:inline-block;font:700 11px 'Inter',sans-serif;border-radius:99px;padding:3px 9px;
  background:var(--raise);border:1px solid var(--line);color:var(--body);margin:8px 6px 0 0}
.chip.new{background:var(--purple-soft);border-color:transparent;color:var(--purple)}
.chip.gapc{background:var(--gap-bg);border-color:transparent;color:var(--gap)}
.bub{background:var(--bubble);border:1px solid var(--bubble-line);border-radius:14px 14px 14px 4px;
  padding:10px 12px;margin-top:8px;font:400 13px/1.5 'Inter',sans-serif;color:var(--ink);white-space:pre-wrap}
.bub i{display:block;font:800 9.5px 'Inter',sans-serif;font-style:normal;letter-spacing:.1em;
  text-transform:uppercase;color:var(--crimson);margin-bottom:4px}
details{margin-top:14px;border-top:1px solid var(--line-2);padding-top:10px}
summary{cursor:pointer;font:700 12px 'Inter',sans-serif;color:var(--muted)}
details .bub{border-style:dashed}
.note{background:var(--raise);border-radius:10px;padding:10px 12px;color:var(--body);margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links button{border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:8px;
  padding:5px 9px;font:700 11.5px 'Inter',sans-serif;cursor:pointer}
.links button:hover{border-color:var(--crimson);color:var(--crimson)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line-2);
  font:500 11.5px/1.6 'Inter',sans-serif;color:var(--muted)}

#reopen{top:16px;right:16px;padding:9px 13px;font:700 12px 'Inter',sans-serif;color:var(--crimson);
  cursor:pointer;display:none}
#reopen.show{display:block}

/* ------------------------------------------------------- first-week view */
#week{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px);background-size:24px 24px}
.tl{max-width:760px;margin:0 auto;padding:24px 16px 120px 16px}
@media (min-width:761px){
  body:not(.pclosed) #week{padding-right:422px}
  .tl{padding-top:250px}                         /* clears the title card */
}
@media (min-width:1300px){
  #week{padding-left:420px}                     /* wide: sit beside the title card */
  .tl{padding-top:40px}
}
@media (max-width:760px){ .tl{padding-top:230px;padding-bottom:62vh} }
.day{margin-bottom:26px}
.dh{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.dchip{flex:0 0 auto;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;
  font:800 12px 'Inter',sans-serif;letter-spacing:.02em}
.dh b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.dh span{display:block;font:600 12px 'Inter',sans-serif;color:var(--muted)}
.day.side{background:var(--gap-bg);border:1.5px dashed var(--gap-line);border-radius:16px;padding:14px 14px 4px}
.day.side .dchip{background:var(--gap);color:var(--surface)}
ol.steps{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
ol.steps::before{content:"";position:absolute;left:7px;top:6px;bottom:18px;width:2px;background:var(--edge)}
.step{position:relative;margin:0 0 10px}
.step::before{content:"";position:absolute;left:-20px;top:17px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--edge)}
.step.k-msg::before{background:var(--crimson);border-color:var(--crimson)}
.step.k-onb::before{background:var(--purple);border-color:var(--purple)}
.step.k-gap::before{border-style:dashed;border-color:var(--gap-line);background:var(--gap-bg)}
.card{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;
  box-shadow:0 1px 3px var(--shadow);transition:box-shadow .12s, border-color .12s}
.card:hover{box-shadow:0 5px 14px var(--shadow);border-color:var(--edge)}
.card.sel{border-color:var(--crimson);box-shadow:0 0 0 3px var(--soft)}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .time{font:800 11px 'Inter',sans-serif;color:var(--body);background:var(--raise);
  border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.card .kick{font:800 9.5px 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.step.k-msg .card .kick{color:var(--crimson)}
.step.k-onb .card .kick{color:var(--purple)}
.step.k-gap .card{background:var(--gap-bg);border:1.5px dashed var(--gap-line);box-shadow:none}
.step.k-gap .card .kick,.step.k-gap .card .lbl{color:var(--gap)}
.step.k-onb .card{border-color:var(--purple-soft);background:linear-gradient(0deg,var(--surface),var(--purple-soft))}
.card .lbl{display:block;font-size:15px;font-weight:800;letter-spacing:-.015em;margin-top:4px}
.card .sub{display:block;font:500 12.5px/1.5 'Inter',sans-serif;color:var(--body);margin-top:2px}
.card .nt{display:block;font:500 12px/1.5 'Inter',sans-serif;color:var(--muted);margin-top:5px}
.card .more{display:inline-block;margin-top:6px;font:700 11.5px 'Inter',sans-serif;color:var(--crimson)}
.vars{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0 0 14px}
.var{flex:1 1 200px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);background:var(--raise);
  border:1.5px dashed var(--edge);border-radius:11px;padding:8px 11px}
.var:hover{border-color:var(--crimson)}
.var.sel{border-color:var(--crimson);border-style:solid}
.var i{display:block;font:800 9px 'Inter',sans-serif;font-style:normal;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.var b{display:block;font-size:13px;font-weight:800;margin-top:2px}
.var span{display:block;font:500 12px/1.45 'Inter',sans-serif;color:var(--body);margin-top:2px}

/* welcome message, section by section, in the panel */
.why{display:flex;gap:8px;margin:6px 0 0 10px;font:500 12.5px/1.5 'Inter',sans-serif;color:var(--body)}
.why b{flex:0 0 auto;font:800 9.5px 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--purple);padding-top:3px}
.push{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--surface);
  border-radius:14px;padding:10px 12px;margin-top:8px}
.push .ic{width:26px;height:26px;border-radius:7px;background:var(--crimson);flex:0 0 26px;
  display:grid;place-items:center;font:800 11px 'Inter',sans-serif;color:#fff}
.push b{display:block;font:700 12.5px 'Inter',sans-serif;white-space:pre-line}
.push span{display:block;font:400 12.5px/1.4 'Inter',sans-serif;opacity:.85}
/* compact message panel */
#panel p.brief{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.45}
#panel ul.ctx{padding-left:16px}
#panel ul.ctx li{margin:2px 0;font-size:13px}
#panel p.chatonly{font:500 12.5px 'Inter',sans-serif;color:var(--muted)}
.grp{margin-top:18px;padding-top:4px;border-top:1px solid var(--line-2)}
.grp h2{font-size:16px}
.card .bell{font-size:11px;line-height:1}
.step.k-group::before{background:var(--crimson);border-color:var(--crimson)}
.step.k-fork::before{background:var(--surface);border-color:var(--ink)}

/* a yes / no fork in the journey */
.fork{background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;
  box-shadow:0 1px 3px var(--shadow)}
.fq{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fq .time{font:800 11px 'Inter',sans-serif;color:var(--body);background:var(--raise);
  border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.fq b{font-size:15px;font-weight:800;letter-spacing:-.015em}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.fb{grid-template-columns:1fr}}
.br{text-align:left;cursor:pointer;font:inherit;color:var(--ink);border-radius:11px;padding:8px 11px;
  border:1.5px solid var(--line);background:var(--raise)}
.br:hover{border-color:var(--edge)}
.br.sel{border-color:var(--crimson);box-shadow:0 0 0 3px var(--soft)}
.br i{display:block;font:800 9px 'Inter',sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase}
.br.yes i{color:var(--good, #1f7a4d)}
.br.no i{color:var(--crimson)}
.br b{display:block;font-size:13.5px;font-weight:800;margin-top:2px}
.br span{display:block;font:500 12px/1.45 'Inter',sans-serif;color:var(--body);margin-top:2px}
.br em{display:block;font:700 11.5px 'Inter',sans-serif;font-style:normal;color:var(--crimson);margin-top:5px}
/* editing a message in the first-week panel */
#panel h3.exh{display:flex;align-items:center;gap:8px}
.edtools{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0}
.edbtn{border:1px solid var(--line);background:var(--raise);color:var(--crimson);border-radius:8px;
  padding:4px 10px;font:700 11.5px 'Inter',sans-serif;cursor:pointer}
.edbtn:hover{border-color:var(--crimson)}
.chip.edited{margin:0;background:var(--purple-soft);border-color:transparent;color:var(--purple)}
.edta{display:block;width:100%;margin-top:8px;border:1.5px solid var(--crimson);border-radius:12px;
  padding:10px 12px;font:400 13px/1.55 'Inter',sans-serif;color:var(--ink);background:var(--surface);resize:vertical}
.edta:focus,.edf input:focus,.edf textarea:focus{outline:2px solid var(--soft);outline-offset:1px}
.edf{display:grid;gap:8px;margin-top:4px}
.edf label{display:grid;gap:3px;font:700 10.5px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.edf input,.edf textarea{border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font:500 13px 'Inter',sans-serif;
  color:var(--ink);background:var(--surface);text-transform:none;letter-spacing:0}
.edf textarea{resize:vertical;line-height:1.45}
.edf label small{font:500 11px 'Inter',sans-serif;text-transform:none;letter-spacing:0;color:var(--muted)}
.edbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.edbar button{border-radius:8px;padding:7px 12px;font:700 12px 'Inter',sans-serif;cursor:pointer;
  border:1px solid var(--line);background:var(--raise);color:var(--body)}
.edbar .edsave{background:var(--crimson);border-color:var(--crimson);color:#fff}
.edbar button:disabled{opacity:.6;cursor:default}
.edbar .edreset{margin-left:auto}
.edmsg{flex-basis:100%;font:600 12px 'Inter',sans-serif;color:var(--muted)}
.edlink{margin-top:8px;border:1px dashed var(--edge);background:transparent;color:var(--crimson);
  border-radius:8px;padding:5px 10px;font:700 11.5px 'Inter',sans-serif;cursor:pointer}
.edlink:hover{border-color:var(--crimson)}



/* phones: the title shrinks, the panel becomes a bottom sheet */
@media (max-width:760px){
  .title p.how,.hint,.legend{display:none}
  .title{padding:11px 13px}
  h1{font-size:15px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58vh}
  #panel.closed{transform:translateY(calc(100% + 24px))}
}
/* netlify build: status line and loading note */
#toast{position:fixed;left:50%;bottom:20px;z-index:30;transform:translate(-50%,16px);opacity:0;
  pointer-events:none;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--surface);
  border-radius:12px;padding:10px 14px;font:600 12.5px/1.45 'Inter',sans-serif;
  box-shadow:0 10px 32px var(--float);transition:opacity .2s, transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tl p.loading{font:600 13px 'Inter',sans-serif;color:var(--muted)}
</style>
</head>
<body>

<div class="float title">
  <p class="eyebrow">HEAL &middot; proactive messaging</p>
  <h1>The member's journey, and what the agent says along it</h1>
  <p class="how how-week">The first week in order, from sign-up. Dashed cards beside a step are
    its variants. Click any card for the detail. Anyone with the link can edit a message, and a
    saved edit is what everyone sees.</p>
  <div class="stats" id="stats"></div>
</div>

<div id="week"><div class="tl" id="tl"></div></div>

<aside class="float" id="panel" aria-live="polite">
  <div class="ph"><span class="k" id="pk"></span>
    <button type="button" class="x" id="pclose" aria-label="Close panel">&times;</button></div>
  <div class="pb" id="pbody"></div>
</aside>
<button type="button" class="float" id="reopen">Show details</button>

<script>
const DATA = {"messages":[{"brief":"Close yesterday, open today: one win and a warm line of motivation, one focus for today, and a nudge to log breakfast first.","ctx":["Yesterday's logs against targets: meals, macros, workout, steps, water","Today's meal options, and workout or rest day","Plans for today (travel, an office lunch)"],"ex":"Good morning!\n\nYesterday: Strength 1 done and 8,200 steps. Two strong days in a row, you're on a roll!\nToday's focus: protein came in a little short, so pick a protein-rich breakfast from your plan, like the moong dal chilla.\nSend me a photo of your breakfast when you have it. Let's make today count!","notif":["Your plan for today",""],"id":"morning","sno":1,"scenario":"Morning Start","when":"08:00 - 08:30","days":"Every day except Friday and Day 1"},{"brief":"Morning Start, plus an early read on the day's plans, because Fridays break routines.","ctx":["Yesterday's recap","Plans mentioned this week (team dinner, sangeet)","Check-in tomorrow?"],"ex":"Happy Friday!\n\nYesterday: every single meal logged. That's the habit that gets results, well done!\nBig weekend ahead with the sangeet tomorrow, so let's keep today steady and save some room for the celebrations.\nLog your breakfast when you have it, and tell me if anything's planned for tonight. We'll make it work!","notif":["Your plan for today",""],"id":"morningFri","sno":2,"scenario":"Morning Start","when":"08:00 - 08:30 on Friday","days":"Weekly"},{"brief":"Comparable weekly numbers: same day, empty stomach, same list.","ctx":["Measurements skipped last time","Travel or illness: offer to move it","Last week's numbers, for the reply, not the ask"],"ex":"It's weekly check-in day!\n\nBefore breakfast or chai, open Analytics and log:\nYour weight\nWaist, hips, chest, thigh, arms and wrist\n\nSame time, empty stomach, every week, so you and {nutritionist} can see what's really changing. Let's see how far you've come!","notif":["Weekly check-in, log your body measurements today",""],"id":"weeklyLog","sno":3,"scenario":"Weekly Log - Weight and Body Measurements","when":"Before 08:00 on check-in day","days":"Weekly"},{"brief":"One quiet day. No guilt, one easy ask to get them back.","ctx":["Last log, and when","A reason they gave, if any"],"ex":"Hey, haven't heard from you since Tuesday lunch. All good? No need to log what you missed, just tell me how today's going.","notif":["{name}, log today's meals and workout",""],"id":"nudgeA","sno":7,"scenario":"Client Missing in Action","when":"24h after the last log or reply","days":"Once per quiet spell"},{"brief":"Two quiet days. Drop the past, ask about one meal.","ctx":["Life events they mentioned (festivals, guests)","Tonight's dinner options"],"ex":"Hey, no pressure at all about the last two days. Let's just do one thing: what's for dinner tonight? A one-line reply is plenty.","notif":["Just log one meal or workout today",""],"id":"nudgeB","sno":8,"scenario":"Client Missing in Action","when":"48h after the last log or reply","days":"Once per quiet spell"},{"brief":"At risk. Offer to fit the plan to their life, and alert the nutritionist.","ctx":["How the plan went before the silence","Life changes mentioned (new job, exams)","Nutritionist alerted"],"ex":"Settling into a new job is a lot. Want a simpler plan for the next couple of weeks, with quick breakfasts and 20-minute workouts? Just reply yes and {nutritionist} will set it up.","notif":["Hard to log meals and workouts lately?",""],"id":"nudgeC","sno":9,"scenario":"Client Missing in Action","when":"72h after the last log or reply","days":"Once per quiet spell"},{"brief":"A workout day is slipping by. Make it easy to still do something tonight.","ctx":["Today's workout and its length","A reason they gave (long day, sore legs)","Workouts done this week"],"ex":"Still time for Strength day 2 tonight? It's about 30 minutes, and even the first circuit counts if the day ran long. Mark it done when you finish!","notif":["Today's workout isn't logged y y 1, let's go!\n\nWithout a recap (nothing logged yet):\n\nGood morning! Today's the day: welcome to Day 1!\n\n{nutritionist} has checked your plan, so everything's ready for you.\nToday: Strength day 1, about 30 minutes, whenever suits you\nBreakfast: pick any option from your plan, portions by the measuring cup\nSend me a photo of your first breakfast and I'll log it. Let's make it count!","many":true,"notif":["Your plan for today",""],"id":"morningDay1","sno":15,"scenario":"Morning Start","when":"08:00 - 08:30 on Day 1","days":"Once"}],"short":{"morning":"Morning Start","morningFri":"Morning Start: Friday","weeklyLog":"Weekly check-in","shiftEarly":"First heads-up","shiftLate":"Last call","shiftWeekend":"Eating-out heads-up","nudgeA":"24h check-in","nudgeB":"48h low-effort reset","nudgeC":"72h re-engagement","backOnline":"Nutritionist back online","workoutNudge":"Workout nudge","contextSet":"Tomorrow's prep","prefAsk":"Preference questions","tip":"Chat tip","morningDay1":"Morning Start: Day 1"},"welcome":{"id":"welcome","label":"Context setting","when":"Right after the onboarding questions","delivery":"In the chat, as the first message","message":"Welcome to HEAL! Your nutritionist is reviewing your plan now, and I'll let you know as soon as it's ready.\n\nWhat to expect\nWorkouts: 3 strength, 3 cardio, 1 active rest day a week\nMeal plan designed by the Nutritionist\nDaily: a recap each morning and next day's plan each night\nWeekly: weigh-in and measurements, before breakfast\n\nWhat you can do\nSnap a meal and I'll log it\nAsk the calories in any dish\nSet reminders, like water every 2 hours\nAsk for your nutritionist any time\n\nPro tip: ask me anything, any hour. If it needs your nutritionist, I'll bring them in.\n\nLet's get started!","intent":"Sets expectations before anything else arrives, in two short lists: what to expect, and what the chat can already do. The pro tip says who handles what: the agent any hour, the nutritionist whenever it needs a person ,"ref":"morning","time":"08:00","variants":[{"label":"Day 1","ref":"morningDay1","note":"A one-line recap if they logged on sign-up day, none if not."},{"label":"Friday","ref":"morningFri","note":"Also asks how the day looks, as Friday plans run late."},{"label":"After a week","ref":"weeklyLog","note":"Check-in day: weight and measurements come first, before breakfast."},{"label":"With a tip","ref":"tip","note":"When the morning makes one relevant (water low yesterday: reminders), for something not tried yet."}]},{"kind":"fork","label":"Logs meals?","time":"Through the day","yes":{"label":"Logs","note":"Each log gets portions, calories and macros back, and feeds tomorrow's recap."},"no":{"label":"Doesn't log","jump":"quiet","note":"24 hours of silence starts the quiet ladder."}},{"kind":"fork","label":"Does the workout?","time":"Workout days","yes":{"label":"Does it","ref":"morning","note":"It opens tomorrow's Morning Start as the recap."},"no":{"label":"Not done by 19:00","ref":"workoutNudge","note":"An evening nudge offers a smaller version."}},{"kind":"msg","ref":"contextSet","time":"21:00","variants":[{"label":"With a tip","ref":"tip","note":"When tomorrow makes one relevant (eating out: the menu photo), for something not tried yet."}]}]},{"id":"quiet","day":"If quiet","date":"No log or reply","title":"The quiet ladder","side":true,"steps":[{"kind":"msg","ref":"nudgeA","time":"24h"},{"kind":"msg","ref":"nudgeB","time":"48h"},{"kind":"msg","ref":"nudgeC","time":"72h"}]}]};
const MSG = Object.fromEntries(DATA.messages.map(m => [m.id, m]));
const panel = document.getElementById('panel');
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
document.getElementById('stats').innerHTML =
  `<span class="stat"><b>${DATA.messages.length}</b>scenarios</span>` +
  `<span class="stat"><b>${DATA.messages.filter(m => m.sno > 10).length}</b>new on 28 Sep</span>`;
addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* ------------------------------------------------------------------ panel */
function openPanel(){ panel.classList.remove('closed'); document.body.classList.remove('pclosed');
  document.getElementById('reopen').classList.remove('show'); }
function closePanel(){ panel.classList.add('closed'); document.body.classList.add('pclosed');
  document.getElementById('reopen').classList.add('show'); }
document.getElementById('pclose').onclick = closePanel;
document.getElementById('reopen').onclick = openPanel;

const lines = s => `<ul>${s.split('\n').filter(Boolean).map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
/* one message's detail, compact: shared by both views */
function notifHTML(n, tools){
  return `<h3 class="exh">Notification ${tools || ''}</h3>` + (n
    ? `<div class="push"><span class="ic">H</span><div><b>${esc(n[0])}</b>${n[1] ? `<span>${esc(n[1])}</span>` : ''}</div></div>`
    : `<p class="chatonly">None. It arrives in the chat only.</p>`);
}
/* editing the notification: a header (required, may run to two lines) and an
   optional body, or none (chat only). Both blocks are drawn and one is
   hidden, so switching keeps what was typed. */
function notifEditHTML(n){
  return `<h3>Notification</h3>
      <div id="ed-notif-on"${n ? '' : ' hidden'}><div class="edf">
        <label>Header<textarea id="ed-nt" rows="2" maxlength="160">${esc(n ? n[0] : '')}</textarea></label>
        <label>Body <small>(optional)</small><input type="text" id="ed-nb" value="${esc(n ? n[1] : '')}" maxlength="200"></label></div>
        <button type="button" class="edlink" data-notif="off">Remove the notification (chat only)</button></div>
      <div id="ed-notif-off"${n ? ' hidden' : ''}><p class="chatonly">None. It arrives in the chat only.</p>
        <button type="button" class="edlink" data-notif="on">+ Add a notification</button></div>`;
}
/* key: the message's edit key. Given only in the first-week view, where the
   message and its notification can be edited and saved. */
function msgBody(m, label, lead, key){
  const ed = key && EDIT.can, open = ed && EDIT.open === key, n = m.notif;
  const tools = ed && !open ? `<span class="edtools">
      ${EDITS[key] ? '<span class="chip edited">Edited</span>' : ''}
      <button type="button" class="edbtn" data-edit="${key}">Edit</button></span>` : '';
  const ntools = ed && !open ? `<span class="edtools">
      <button type="button" class="edbtn" data-edit="${key}" data-focus="ed-nt">Edit</button></span>` : '';
  const notif = open ? notifEditHTML(n) : notifHTML(n, ntools);
  const example = open
    ? `<textarea id="ed-ex" class="edta" rows="${m.many ? 14 : 7}">${esc(m.ex)}</textarea>${editBar(key)}`
    : `<div class="bub">${esc(m.ex)}</div>`;
  return `
      <h2>${esc(label)}</h2>
      <div class="when">${esc(m.when)} &middot; ${esc(m.days)}</div>
      ${m.sno > 10 ? '<span class="chip new">New 28 Sep, no client copy yet</span>' : ''}
      ${lead ? `<div class="note">${esc(lead)}</div>` : ''}
      <h3>Intent</h3><p class="brief">${esc(m.brief)}</p>
      ${notif}
      <h3>Context</h3><ul class="ctx">${m.ctx.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      <h3 class="exh">Example${m.many ? 's, one goes out at a time' : ''} ${tools}</h3>${example}`;
}
function editBar(key){
  return `<div class="edbar">
      <button type="button" class="edsave" data-save="${key}"${EDIT.busy ? ' disabled' : ''}>${EDIT.busy ? 'Saving...' : 'Save'}</button>
      <button type="button" class="edcancel" data-cancel="1"${EDIT.busy ? ' disabled' : ''}>Cancel</button>
      ${EDITS[key] ? `<button type="button" class="edreset" data-reset="${key}"${EDIT.busy ? ' disabled' : ''}>Restore original</button>` : ''}
      ${EDIT.msg ? `<span class="edmsg">${esc(EDIT.msg)}</span>` : ''}</div>`;
}
const msgKick = m => `${m.sno > 10 ? 'New message' : 'Proactive message'} &middot; ${esc(m.scenario.replace(/^\d+ · /, ''))}`;

/* ======================================================== first-week view */
let weekSel = null;
const KICK = {msg: 'Proactive message', state: 'What the member does', gap: 'Not written yet',
              fork: 'What the member does', group: 'Proactive messages'};

function stepInfo(s){
  if (s.kind === 'msg'){
    const m = MSG[s.ref];
    return {kick: m.sno > 10 ? 'New message' : KICK.msg, label: DATA.short[s.ref], sub: m.brief,
            bell: !!m.notif};
  }
  if (s.kind === 'onb'){
    return s.ref === 'welcome'
      ? {kick: 'First message', label: DATA.welcome.label, sub: DATA.welcome.intent.split('. ')[0] + '.'}
      : {kick: 'Push + chat', label: DATA.planReady.label, sub: DATA.planReady.brief, bell: true};
  }
  if (s.kind === 'group') return {kick: KICK.group, label: s.label, sub: s.note, bell: true};
  return {kick: KICK[s.kind], label: s.label, sub: s.note || ''};
}

function branchHTML(b, key, cls){
  return `<button type="button" class="br ${cls}${weekSel === key ? ' sel' : ''}" data-k="${key}"${b.jump ? ` data-jump="${b.jump}"` : ''}>
      <i>${cls === 'yes' ? 'Yes' : 'No'}</i><b>${esc(b.label)}</b><span>${esc(b.note)}</span>
      ${b.ref ? `<em>${esc(DATA.short[b.ref])} &rarr;</em>` : b.jump ? '<em>The quiet ladder &darr;</em>' : ''}</button>`;
}

function renderWeek(){
  document.getElementById('tl').innerHTML = DATA.timeline.map((d, di) => `
    <section class="day${d.side ? ' side' : ''}"${d.id ? ` id="sec-${d.id}"` : ''}>
      <div class="dh"><span class="dchip">${esc(d.day)}</span>
        <div><b>${esc(d.title)}</b><span>${esc(d.date)}</span></div></div>
      <ol class="steps">${d.steps.map((s, si) => {
        const i = stepInfo(s), key = `${di}.${si}`;
        const card = s.kind === 'fork'
          ? `<div class="fork"><div class="fq"><span class="time">${esc(s.time)}</span><b>${esc(s.label)}</b></div>
              <div class="fb">${branchHTML(s.yes, key + '.y', 'yes')}${branchHTML(s.no, key + '.n', 'no')}</div></div>`
          : `<button type="button" class="card${weekSel === key ? ' sel' : ''}" data-k="${key}">
              <span class="top"><span class="time">${esc(s.time)}</span><span class="kick">${esc(i.kick)}</span>
                ${i.bell ? '<span class="bell" title="Sent as a notification">&#128276;</span>' : ''}</span>
              <span class="lbl">${esc(i.label)}</span>
              ${i.sub ? `<span class="sub">${esc(i.sub)}</span>` : ''}
              ${s.kind !== 'group' && s.kind !== 'state' && s.kind !== 'gap' && s.note ? `<span class="nt">${esc(s.note)}</span>` : ''}
            </button>`;
        return `<li class="step k-${s.kind}">${card}
          ${(s.variants || []).length ? `<div class="vars">${s.variants.map((v, vi) => `
            <button type="button" class="var${weekSel === key + '.' + vi ? ' sel' : ''}" data-k="${key}.${vi}">
              <i>Variant</i><b>${esc(v.label)}</b><span>${esc(v.note)}</span></button>`).join('')}</div>` : ''}
        </li>`;
      }).join('')}</ol>
    </section>`).join('');
}

function showWeekPanel(key, keepScroll){
  const [a, b, c] = key.split('.');
  const d = DATA.timeline[+a], s = d.steps[+b];
  const K = document.getElementById('pk'), B = document.getElementById('pbody');
  const where = `${esc(d.day)} &middot; ${esc(d.title)}`;
  const stateBody = (label, sub, note, gap) => `<h2>${esc(label)}</h2>
      ${sub ? `<div class="when">${esc(sub)}</div>` : ''}
      ${gap ? '<span class="chip gapc">No message defined</span>' : ''}
      ${note ? `<div class="note">${esc(note)}</div>` : ''}`;

  if (c === 'y' || c === 'n'){                           // a fork branch
    const br = c === 'y' ? s.yes : s.no;
    if (br.ref){ K.innerHTML = msgKick(MSG[br.ref]);
      B.innerHTML = msgBody(MSG[br.ref], DATA.short[br.ref], `${s.label} ${br.label}: ${br.note}`, br.ref); }
    else { K.innerHTML = `${esc(s.label)} &middot; ${where}`; B.innerHTML = stateBody(br.label, s.time, br.note); }
  } else if (c !== undefined){                           // a variant
    const v = s.variants[+c];
    if (v.ref){ K.innerHTML = `Variant &middot; ${where}`;
      B.innerHTML = msgBody(MSG[v.ref], DATA.short[v.ref], `${v.label}: ${v.note}`, v.ref); }
    else { K.innerHTML = `Variant &middot; ${where}`;
      B.innerHTML = stateBody(v.label, 'Variant of ' + stepInfo(s).label, v.note); }
  } else if (s.kind === 'msg'){
    K.innerHTML = msgKick(MSG[s.ref]);
    B.innerHTML = msgBody(MSG[s.ref], DATA.short[s.ref], s.note ? `${d.day}: ${s.note}` : '', s.ref);
  } else if (s.kind === 'group'){
    K.innerHTML = `${s.refs.length} messages &middot; ${where}`;
    B.innerHTML = `<h2>${esc(s.label)}</h2><div class="note">${esc(s.note)}</div>` +
      s.refs.map(r => `<div class="grp">${msgBody(MSG[r], DATA.short[r], '', r)}</div>`).join('');
  } else if (s.ref === 'planReady'){
    K.innerHTML = `Not proactive &middot; ${where}`;
    B.innerHTML = msgBody(DATA.planReady, DATA.planReady.label, s.note, 'planReady');
  } else if (s.ref === 'welcome'){
    const w = DATA.welcome;
    K.innerHTML = `First message &middot; ${where}`;
    B.innerHTML = `<h2>${esc(w.label)}</h2>
      <div class="when">${esc(w.when)} &middot; ${esc(w.delivery)}</div>
      <h3>Intent</h3><p class="brief">${esc(w.intent)}</p>
      <h3 class="exh">The message ${EDIT.can && EDIT.open !== 'welcome' ? `<span class="edtools">${EDITS.welcome ? '<span class="chip edited">Edited</span>' : ''}<button type="button" class="edbtn" data-edit="welcome">Edit</button></span>` : ''}</h3>
      ${EDIT.can && EDIT.open === 'welcome'
        ? `<textarea id="ed-wm" class="edta" rows="16">${esc(w.message)}</textarea>${editBar('welcome')}`
        : `<div class="bub">${esc(w.message)}</div>`}`;
  } else {
    K.innerHTML = `${esc(KICK[s.kind])} &middot; ${where}`;
    B.innerHTML = stateBody(s.label, s.time, s.note, s.kind === 'gap');
  }
  if (!keepScroll) B.scrollTop = 0;
}

function selectWeek(key, scroll){
  if (EDIT.open && !EDIT.busy){ EDIT.open = null; EDIT.msg = ''; }
  weekSel = key; renderWeek(); showWeekPanel(key); openPanel();
  if (scroll){
    const el = document.querySelector(`#tl [data-k="${key}"]`);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
}
document.getElementById('tl').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b) return;
  const jump = b.dataset.jump;
  selectWeek(b.dataset.k);                       // re-renders, so scroll afterwards
  if (jump) setTimeout(() =>
    document.getElementById('sec-' + jump).scrollIntoView({behavior: 'smooth', block: 'start'}), 0);
});
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-wk]'); if (b) selectWeek(b.dataset.wk, true);
});

/* ================================================== editing, and saving it
   Netlify build. Anyone with the link can edit a message and save it. Saved
   edits live on the server (/api/edits, Netlify Blobs), one record per
   message, so two people saving different messages never overwrite each
   other. The page loads them before it first renders, and again whenever
   the tab comes back into view. Every save is also kept in a history. */
const API = '/api/edits';
let EDITS = {};                  // key -> the edited value, only where it differs from the original
let REV = {};                    // key -> when the server last saved it, to catch a clash
const EDIT = {can: false, open: null, busy: false, msg: '', draft: null};
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* originals first, then the saved edits on top */
const ORIG = {};
function editTarget(key){ return key === 'planReady' ? DATA.planReady : key === 'welcome' ? DATA.welcome : MSG[key]; }
[...DATA.messages.map(m => m.id), 'planReady', 'welcome'].forEach(k => {
  const t = editTarget(k);
  ORIG[k] = k === 'welcome' ? {message: t.message} : {ex: t.ex, notif: t.notif ? t.notif.slice() : null};
});
function applyEdits(){
  Object.keys(ORIG).forEach(k => {
    const t = editTarget(k), o = ORIG[k], e = EDITS[k] || {};
    if (k === 'welcome'){ t.message = typeof e.message === 'string' ? e.message : o.message; return; }
    t.ex = typeof e.ex === 'string' ? e.ex : o.ex;
    // an edit can change, add or remove the notification
    t.notif = 'notif' in e ? (Array.isArray(e.notif) ? e.notif.slice(0, 2) : null)
                           : (o.notif ? o.notif.slice() : null);
  });
}
/* the server's records -> EDITS and REV; an edit equal to the original is no edit */
function takeServer(records){
  EDITS = {}; REV = {};
  Object.entries(records || {}).forEach(([k, r]) => {
    if (!ORIG[k] || !r || !r.value) return;
    REV[k] = r.at;
    if (!same(r.value, ORIG[k])) EDITS[k] = r.value;
  });
  applyEdits();
}
async function loadEdits(){
  const r = await fetch(API, {cache: 'no-store'});
  if (!r.ok) throw new Error('load ' + r.status);
  takeServer((await r.json()).edits);
}

/* a short status line, for when the editor is closed */
const toastEl = document.createElement('div');
toastEl.id = 'toast'; toastEl.setAttribute('role', 'status');
document.body.appendChild(toastEl);
let toastTimer = null;
function toast(msg, sticky){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
}

function refreshPanel(){
  if (!document.body.classList.contains('week') || !weekSel) return;
  showWeekPanel(weekSel, true);
  const d = EDIT.draft;                      // after a clash, put the editor's text back
  if (d && EDIT.open !== d.key) EDIT.draft = null;
  else if (d){
    const set = (id, v) => { const f = document.getElementById(id); if (f && typeof v === 'string') f.value = v; };
    if (d.key === 'welcome') set('ed-wm', d.val.message);
    else {
      set('ed-ex', d.val.ex);
      const on = document.getElementById('ed-notif-on'), off = document.getElementById('ed-notif-off');
      if (on && off){ on.hidden = !d.val.notif; off.hidden = !!d.val.notif; }
      if (d.val.notif){ set('ed-nt', d.val.notif[0]); set('ed-nb', d.val.notif[1]); }
    }
  }
}

function readForm(key){
  if (key === 'welcome') return {message: document.getElementById('ed-wm').value.trim()};
  const out = {ex: document.getElementById('ed-ex').value.trim(), notif: ORIG[key].notif};
  const on = document.getElementById('ed-notif-on');
  if (on) out.notif = on.hidden ? null
    : [document.getElementById('ed-nt').value.trim(), document.getElementById('ed-nb').value.trim()];
  return out;
}

/* value null restores the original for everyone */
async function saveKey(key, value){
  EDIT.busy = true; EDIT.msg = ''; refreshPanel();
  let done = '';
  try {
    const r = await fetch(API, {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({key, value, base: REV[key] || null})});
    const j = await r.json().catch(() => ({}));
    if (j.edits){ takeServer(j.edits); renderWeek(); }
    if (r.ok){
      EDIT.open = null; EDIT.draft = null;
      done = value ? 'Saved. Everyone with the link now sees this version.' : 'Restored the original for everyone.';
    } else if (r.status === 409){
      EDIT.draft = value ? {key, val: value} : null;
      EDIT.msg = 'Someone else saved this message while you were editing. Your text is still here: ' +
                 'Save again to replace theirs, or Cancel to keep theirs.';
    } else if (r.status === 400 || r.status === 413) EDIT.msg = j.error || 'That edit could not be saved.';
    else EDIT.msg = 'Could not save just now. Try again in a moment.';
  } catch (e) { EDIT.msg = 'Could not reach the server. Check the connection and try again.'; }
  EDIT.busy = false; refreshPanel();
  if (done) toast(done);
}

function saveEdit(key){
  const val = readForm(key);
  if (key !== 'welcome' && !val.ex){ EDIT.msg = 'The example message cannot be empty.'; refreshPanel(); return; }
  if (key === 'welcome' && !val.message){ EDIT.msg = 'The message cannot be empty.'; refreshPanel(); return; }
  if (val.notif && !val.notif[0]){ EDIT.msg = 'The notification needs a header.'; refreshPanel(); return; }
  const now = EDITS[key] || ORIG[key];
  if (same(val, now) && !EDIT.draft){ EDIT.open = null; EDIT.msg = ''; refreshPanel(); return; }
  saveKey(key, same(val, ORIG[key]) ? null : val);
}
function resetEdit(key){ saveKey(key, null); }

panel.addEventListener('click', e => {
  const t = e.target.closest('[data-edit],[data-save],[data-cancel],[data-reset],[data-notif]');
  if (!t || EDIT.busy) return;
  if (t.dataset.notif){                          // add or remove the notification
    const on = t.dataset.notif === 'on';
    document.getElementById('ed-notif-on').hidden = !on;
    document.getElementById('ed-notif-off').hidden = on;
    if (on) document.getElementById('ed-nt').focus();
    return;
  }
  if (t.dataset.edit){ EDIT.open = t.dataset.edit; EDIT.msg = ''; refreshPanel();
    const f = document.getElementById(t.dataset.focus || (t.dataset.edit === 'welcome' ? 'ed-wm' : 'ed-ex'));
    if (f && !f.closest('[hidden]')) f.focus(); else { const x = document.getElementById('ed-ex'); if (x) x.focus(); } }
  else if (t.dataset.save) saveEdit(t.dataset.save);
  else if (t.dataset.reset) resetEdit(t.dataset.reset);
  else { EDIT.open = null; EDIT.msg = ''; refreshPanel(); }
});

/* load the saved edits, then render. If the server is slow or down, show
   the originals with editing off, and switch editing on once they arrive. */
document.body.classList.add('week');
document.getElementById('tl').innerHTML = '<p class="loading">Loading the latest edits...</p>';
const EDITS_LOADED = loadEdits();
function editingReady(){ EDIT.can = true; toastEl.classList.remove('show'); }
Promise.race([EDITS_LOADED, new Promise((ok, no) => setTimeout(() => no(new Error('slow')), 6000))])
  .then(editingReady, () => {
    toast('Could not load the saved edits yet, so this shows the originals. Editing is off until they load.', true);
    EDITS_LOADED.then(() => { editingReady(); renderWeek(); refreshPanel(); }, () => {});
  })
  .then(() => { renderWeek(); selectWeek('0.1'); });

/* back on the tab: pick up what others saved meanwhile */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !EDIT.can || EDIT.open || EDIT.busy) return;
  loadEdits().then(() => { renderWeek(); refreshPanel(); }, () => {});
});
</script>
</body>
</html>
