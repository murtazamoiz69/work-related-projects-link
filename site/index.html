<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint Planner</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --col: #ebedf0;
    --ink: #1d2125;
    --muted: #626f86;
    --line: #dcdfe4;
    --accent: #3f5fd6;
    --accent-ink: #ffffff;
    --accent-soft: #e9edfb;
    --danger: #c9372c;
    --shadow: 0 1px 2px rgba(9, 30, 66, .18);
    --vhigh-bg: #ffe9e7; --vhigh: #c9372c;
    --high-bg: #fff0e0;  --high: #d86b12;
    --med-bg: #fff8d6;   --med: #a88400;
    --low-bg: #e6f2ff;   --low: #2f6fbf;
    --today: #3f5fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a1d; --panel: #22272b; --col: #1d2125; --ink: #dee4ea; --muted: #9fadbc;
      --line: #384047; --accent: #7f9cf5; --accent-ink: #10131a; --accent-soft: #263055;
      --danger: #f87168; --shadow: 0 1px 2px rgba(0, 0, 0, .5);
      --vhigh-bg: #3d2421; --vhigh: #f87168;
      --high-bg: #3b2a1a;  --high: #f5a35c;
      --med-bg: #36301a;   --med: #e2c044;
      --low-bg: #1c2d41;   --low: #79aef0;
      --today: #7f9cf5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.link { border: 0; background: none; padding: 0 4px; color: var(--muted); }

  /* Top bar */
  .top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 16px; }
  .brand span { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .tabs { display: flex; gap: 4px; }
  .tabs a {
    text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-weight: 600;
  }
  .tabs a.on { background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  .saved { color: var(--muted); font-size: 12px; }
  .saved.err { color: var(--danger); }
  .top .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  main { flex: 1; min-height: 0; }
  .view { height: 100%; }
  .view[hidden] { display: none; }

  /* Board */
  .board {
    height: 100%; display: grid; gap: 12px; padding: 12px 16px;
    grid-template-columns: minmax(270px, 1.15fr) repeat(3, minmax(250px, 1fr));
    overflow-x: auto;
  }
  .col {
    background: var(--col); border-radius: 10px; display: flex; flex-direction: column; min-height: 0;
  }
  .col-head { padding: 12px 12px 8px; }
  .col-title { display: flex; align-items: baseline; gap: 8px; font-weight: 700; }
  .count { color: var(--muted); font-weight: 600; font-size: 12px; }
  .col-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent); margin-left: 4px;
  }
  .mix { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .mix span { font-size: 11px; padding: 0 6px; border-radius: 4px; font-weight: 600; }
  .quick { padding: 0 12px 8px; display: flex; gap: 6px; }
  .quick input, .search-in {
    flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
  }
  .quick button { flex: 0 0 auto; }
  .col-title .search { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: 1; justify-content: flex-end; min-width: 0; }
  .search-in { padding: 4px 8px; font-weight: 400; font-size: 13px; max-width: 220px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: 6px;
    border: 1px solid transparent; background: transparent; color: var(--muted); flex: 0 0 auto;
  }
  .icon-btn:hover { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .icon-btn.on { color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }
  .list { flex: 1; overflow-y: auto; padding: 4px 12px 12px; min-height: 60px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 8px; border: 1px dashed var(--line); border-radius: 8px; }

  .card {
    background: var(--panel); border-radius: 8px; padding: 8px 10px 9px; box-shadow: var(--shadow);
    border-left: 4px solid transparent; cursor: grab; user-select: none;
  }
  .card:hover { outline: 1px solid var(--line); }
  .card .ctop { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); min-height: 22px; }
  .cact { display: flex; gap: 2px; margin-left: auto; }
  .ptag + .cact { margin-left: 0; }
  .cact .icon-btn { width: 24px; height: 24px; }
  .cact .icon-btn svg { width: 14px; height: 14px; }
  .cact .del:hover { color: var(--danger); }
  .card .ctitle { margin-top: 2px; font-weight: 500; word-break: break-word; }
  .card .cmeta { display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .card .cmeta:empty { display: none; }
  .avatars { margin-left: auto; display: flex; }
  .av {
    width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 10px; font-weight: 700; background: var(--accent-soft); color: var(--accent);
    border: 2px solid var(--panel); margin-left: -6px;
  }
  .ptag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; }
  .p-vhigh { background: var(--vhigh-bg); border-left-color: var(--vhigh); }
  .p-high  { background: var(--high-bg);  border-left-color: var(--high); }
  .p-med   { background: var(--med-bg);   border-left-color: var(--med); }
  .p-low   { background: var(--low-bg);   border-left-color: var(--low); }
  .t-vhigh { background: var(--vhigh); color: #fff; }
  .t-high  { background: var(--high);  color: #fff; }
  .t-med   { background: var(--med);   color: #fff; }
  .t-low   { background: var(--low);   color: #fff; }
  .sortable-ghost { opacity: .35; }
  .sortable-drag { box-shadow: 0 8px 20px rgba(9, 30, 66, .25); }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(9, 30, 66, .35); }
  .scrim[hidden] { display: none; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel);
    box-shadow: -8px 0 24px rgba(9, 30, 66, .2); display: flex; flex-direction: column; z-index: 5;
  }
  .drawer[hidden] { display: none; }
  .dr-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .dr-head .x { margin-left: auto; font-size: 18px; line-height: 1; padding: 4px 10px; }
  .dr-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .dr-body > * { flex-shrink: 0; }
  .title-in {
    display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    font-size: 18px; line-height: 1.4; font-weight: 700; resize: none; background: var(--panel); overflow: hidden;
    min-height: 44px;
  }
  .title-in:focus { border-color: var(--accent); outline: none; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  select, .field input, .field textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; background: var(--panel);
  }
  .field textarea { resize: vertical; }
  .field .title-in { resize: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 4px 2px 10px; font-weight: 600; font-size: 13px; }
  .chip button { border: 0; background: none; color: inherit; padding: 0 6px; font-size: 14px; line-height: 1; }
  .att { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .att li { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .att a { color: var(--accent); word-break: break-all; flex: 1; }
  .att .size { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 120px; }
  .filebtn { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; background: var(--panel); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .comments { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .comments li { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; }
  .comments .who { font-weight: 700; }
  .comments .when { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .comments .text { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .dr-foot { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 12px; }
  .dr-foot button { margin-left: auto; }

  /* Calendar */
  .cal-wrap { height: 100%; overflow-y: auto; padding: 16px; }
  .cal-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .week { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .week-head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .week-head .name { font-weight: 700; font-size: 15px; }
  .week-head .sub { color: var(--muted); font-size: 13px; }
  .wscroll { overflow-x: auto; }
  .gwrap { min-width: 910px; }
  .ghead { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .dhead { padding: 6px 8px; border-right: 1px solid var(--line); position: relative; min-height: 46px; }
  .dhead:last-child { border-right: 0; }
  .dhead.weekend { background: var(--col); }
  .dhead.today { box-shadow: inset 0 -3px 0 var(--today); }
  .dhead .dn { font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .dhead .dd { font-weight: 700; }
  .dhead .flags { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .dhead .flag { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--danger); }
  .dhead .flag.now { color: var(--today); }
  .gantt {
    position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 36px;
    row-gap: 6px; padding: 8px 0; min-height: 60px;
  }
  .gbg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--line); pointer-events: none; }
  .gbg:last-of-type { border-right: 0; }
  .gbg.weekend { background: var(--col); }
  .gbg.today { background: var(--accent-soft); }
  .gempty { grid-column: 1 / -1; align-self: center; color: var(--muted); font-size: 12px; padding: 0 14px; position: relative; }
  .gbar {
    position: relative; z-index: 1; margin: 0 4px; display: flex; align-items: center; gap: 6px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--muted); border-radius: 6px;
    padding: 0 12px; font-size: 12px; cursor: grab; user-select: none; touch-action: none; box-shadow: var(--shadow);
  }
  .gbar:hover { outline: 1px solid var(--muted); }
  .gbar .bid { color: var(--muted); flex: 0 0 auto; }
  .gbar .bt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .gbar .ptag { flex: 0 0 auto; margin-left: 0; font-size: 10px; padding: 0 4px; }
  .gbar .grip { position: absolute; top: 0; bottom: 0; width: 9px; cursor: ew-resize; }
  .gbar .grip.l { left: -4px; } .gbar .grip.r { right: -1px; }
  .gbar .grip::after { content: ''; position: absolute; top: 9px; bottom: 9px; left: 3px; width: 2px; border-radius: 2px; background: var(--muted); opacity: 0; }
  .gbar:hover .grip::after { opacity: .6; }
  .gbar.p-vhigh { border-left-color: var(--vhigh); } .gbar.p-high { border-left-color: var(--high); }
  .gbar.p-med { border-left-color: var(--med); } .gbar.p-low { border-left-color: var(--low); }
  .gbar.lifted { opacity: .35; }
  .gbar.preview { opacity: .85; outline: 2px dashed var(--accent); z-index: 2; pointer-events: none; }
  .gfloat {
    position: fixed; z-index: 20; pointer-events: none; background: var(--panel); border: 1px solid var(--accent);
    border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(9, 30, 66, .25); max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .noday { display: flex; gap: 10px; align-items: flex-start; padding: 8px 14px 10px; border-top: 1px solid var(--line); }
  .noday .lbl2 { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 8px; white-space: nowrap; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; flex: 1; padding: 4px; border: 1px dashed var(--line); border-radius: 8px; }
  .strip:empty::after { content: attr(data-empty); color: var(--muted); font-size: 12px; padding: 6px 4px; }
  .strip.over, .gantt.over { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ccard {
    width: 190px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px;
    padding: 5px 7px; font-size: 12px; cursor: grab; user-select: none; touch-action: none; box-shadow: var(--shadow);
  }
  .ccard:hover { outline: 1px solid var(--muted); }
  .ccard .ctop { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
  .ccard .ptag { font-size: 10px; padding: 0 4px; }
  .ccard .ct { font-weight: 600; line-height: 1.3; margin-top: 1px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ccard.p-vhigh, .ccard.p-high, .ccard.p-med, .ccard.p-low { border-color: transparent; }
  .ccard.p-vhigh { border-left-color: var(--vhigh); } .ccard.p-high { border-left-color: var(--high); }
  .ccard.p-med { border-left-color: var(--med); } .ccard.p-low { border-left-color: var(--low); }
  .ccard.lifted { opacity: .35; }
  .unplanned .strip { margin: 10px 14px 12px; }
  .cal-hint { color: var(--muted); font-size: 13px; }
  .cday { display: inline-flex; align-items: center; gap: 3px; }
  .cday svg { width: 12px; height: 12px; }

  @media (max-width: 760px) {
    .top { gap: 10px; }
    .board { grid-template-columns: repeat(4, minmax(260px, 85vw)); }
    .fields { grid-template-columns: 1fr; }
    .noday { flex-direction: column; gap: 4px; }
    .noday .lbl2 { padding-top: 0; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 9;
    background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(9, 30, 66, .3); max-width: min(560px, calc(100vw - 32px)); font-weight: 500;
  }
  .toast[hidden] { display: none; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Sprint Planner<span>Sprints 4 to 6</span></div>
  <nav class="tabs">
    <a href="#board" data-view="board">Board</a>
    <a href="#calendar" data-view="calendar">Calendar</a>
  </nav>
  <div class="spacer"></div>
  <div class="actions">
    <span class="saved" id="saved" aria-live="polite">Loading the plan...</span>
    <button id="newBtn" class="primary" disabled>+ New item</button>
    <button id="exportBtn" title="Download a copy of the whole plan as a backup">Export</button>
  </div>
</header>

<main>
  <section id="board" class="view">
    <div class="board" id="boardEl"></div>
  </section>
  <section id="calendar" class="view" hidden>
    <div class="cal-wrap"><div class="cal-inner" id="calEl"></div></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Item details">
  <div class="dr-head"><span id="drId"></span><button class="x" id="drClose" aria-label="Close">&times;</button></div>
  <div class="dr-body">
    <label class="field"><div class="lbl">Title</div><textarea id="fTitle" class="title-in" rows="1" placeholder="What is this item?"></textarea></label>
    <div class="fields">
      <label><div class="lbl">Sprint</div><select id="fCol"></select></label>
      <label><div class="lbl">Priority</div><select id="fPri"></select></label>
      <label><div class="lbl">Start</div><select id="fStart"></select></label>
      <label><div class="lbl">End</div><select id="fEnd"></select></label>
    </div>
    <div class="field">
      <div class="lbl">Assignees</div>
      <div class="chips" id="fAssignees"></div>
      <input id="fAssigneeIn" placeholder="Type a name and press Enter">
    </div>
    <div class="field">
      <div class="lbl">Description</div>
      <textarea id="fDesc" rows="6" placeholder="What needs to be done"></textarea>
    </div>
    <div class="field">
      <div class="lbl">Attachments</div>
      <ul class="att" id="fAtt"></ul>
      <div class="row">
        <input id="fLinkName" placeholder="Name (optional)">
        <input id="fLinkUrl" placeholder="https://link">
        <button id="fLinkAdd">Add link</button>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="filebtn">Upload file<input type="file" id="fFile" multiple hidden></label>
      </div>
      <div class="hint">Files up to 4 MB each. Use a link for anything bigger.</div>
    </div>
    <div class="field">
      <div class="lbl">Comments</div>
      <ol class="comments" id="fComments"></ol>
      <input id="fMe" placeholder="Your name" style="margin-bottom:6px">
      <textarea id="fComment" rows="3" placeholder="Write a comment"></textarea>
      <div class="row" style="margin-top:6px"><button id="fCommentAdd" class="primary">Comment</button></div>
    </div>
    <div class="dr-foot"><span id="fDates"></span><button id="fDelete" class="danger">Delete item</button></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script type="module">
import { SPRINTS, PRIORITIES, COLS, emptyPlan, normalize, applyOp, colOf, newId } from './plan-ops.mjs';

const PRI_BY = Object.fromEntries(PRIORITIES.map((p) => [p.id, p]));
const MAX_FILE = 4 * 1024 * 1024;
const POLL_MS = 4000;
const NAME_KEY = 'sprint-planner-name';
const $ = (id) => document.getElementById(id);

let server = emptyPlan();   // the last copy the server sent
let plan = emptyPlan();     // what is shown: the server copy plus changes not yet saved
let queue = [];             // changes waiting to be saved, oldest first
let sending = false;
let loaded = false;
let openId = null;
let dragging = false;
let query = '';
let me = '';
try { me = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}

// ---------- helpers ----------
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const d = (iso) => { const p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmt = (dt) => dt.getDate() + ' ' + MON[dt.getMonth()];
const fmtDay = (dt) => DAY[dt.getDay()] + ' ' + fmt(dt);
const range = (s) => fmt(d(s.start)) + ' to ' + fmt(d(s.end));
const iso = (dt) => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const sprintDays = (s) => { const a = d(s.start); return Array.from({ length: 7 }, (_, i) => new Date(a.getFullYear(), a.getMonth(), a.getDate() + i)); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const stamp = (ts) => { const t = new Date(ts); return fmt(t) + ', ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); };
const initials = (n) => { const p = n.trim().split(/\s+/); return ((p[0] || '')[0] || '').toUpperCase() + ((p[1] || '')[0] || '').toUpperCase(); };
const sizeLabel = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
function sprintStatus(s) {
  const t = today(), a = d(s.start), b = d(s.end);
  if (t < a) { const n = daysBetween(t, a); return { live: false, text: 'Starts in ' + n + (n === 1 ? ' day' : ' days') }; }
  if (t > b) return { live: false, text: 'Ended' };
  const left = daysBetween(t, b);
  return { live: true, text: left === 0 ? 'In progress, ends today' : 'In progress, ' + left + (left === 1 ? ' day' : ' days') + ' left' };
}

function setStatus(text, err) { const el = $('saved'); el.textContent = text; el.classList.toggle('err', !!err); }
let toastTimer = null;
function toast(text) {
  const el = $('toast'); el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
}

// ---------- saving ----------
function rebase() {
  plan = clone(server);
  for (const op of queue) applyOp(plan, op);
  renderAll();
}
function commit(op) {
  op.by = me;
  const err = applyOp(plan, op);
  if (err) { toast(err); return false; }
  queue.push(op);
  renderAll();
  flush();
  return true;
}
async function flush() {
  if (sending || !queue.length) return;
  sending = true;
  setStatus('Saving...');
  const op = queue[0];
  try {
    const r = await fetch('/api/plan', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ op, by: me }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok || r.status === 400 || r.status === 409) {
      queue.shift();
      if (j.plan) server = normalize(j.plan);
      if (!r.ok && j.error) toast('Not saved: ' + j.error);
      const saved = r.ok && op.start && server.items[op.id];
      if (saved && saved.start !== op.start) toast('The server did not keep the dates. It is running older code; restart or redeploy it.');
      rebase();
    } else {
      throw new Error(j.error || 'HTTP ' + r.status);
    }
  } catch (e) {
    sending = false;
    setStatus('Not saved yet, retrying...', true);
    setTimeout(flush, 3000);
    return;
  }
  sending = false;
  if (queue.length) flush(); else setStatus('All changes saved');
}
async function poll() {
  if (document.hidden || sending || queue.length || dragging || pendingText()) return;
  try {
    const r = await fetch('/api/plan', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const fresh = normalize(j.plan);
    if (!loaded) { loaded = true; $('newBtn').disabled = false; setStatus('All changes saved'); server = fresh; rebase(); return; }
    if (fresh.version !== server.version && !sending && !queue.length && !dragging) { server = fresh; rebase(); }
    if ($('saved').classList.contains('err')) setStatus('All changes saved');
  } catch (e) {
    setStatus(loaded ? 'Cannot reach the server; changes from others may be missing' : 'Could not load the plan. Retrying...', true);
  }
}
window.addEventListener('beforeunload', (e) => { if (queue.length || pendingText()) { e.preventDefault(); e.returnValue = ''; } });

// ---------- board ----------
const ICON = {
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
};
let searchOpen = false;

function cardHTML(it, col) {
  const p = it.priority ? PRI_BY[it.priority] : null;
  let meta = '';
  if (it.comments.length) meta += '<span title="Comments">&#128172; ' + it.comments.length + '</span>';
  if (it.attachments.length) meta += '<span title="Attachments">&#128206; ' + it.attachments.length + '</span>';
  if (it.start && col !== 'backlog') meta += '<span class="cday" title="Dates in the calendar">' + ICON.cal + spanLabel(it) + '</span>';
  if (it.assignees.length) {
    meta += '<span class="avatars">' + it.assignees.slice(0, 4).map((a) => '<span class="av" title="' + esc(a) + '">' + esc(initials(a)) + '</span>').join('') + '</span>';
  }
  const hide = matches(it) ? '' : ' style="display:none"';
  return '<div class="card' + (p ? ' p-' + p.id : '') + '" data-id="' + it.id + '"' + hide + '>' +
    '<div class="ctop"><span>#' + it.num + '</span>' + (p ? '<span class="ptag t-' + p.id + '">' + p.label + '</span>' : '') +
    '<span class="cact"><button class="icon-btn edit" data-act="edit" title="Edit" aria-label="Edit #' + it.num + '">' + ICON.edit + '</button>' +
    '<button class="icon-btn del" data-act="delete" title="Delete" aria-label="Delete #' + it.num + '">' + ICON.trash + '</button></span></div>' +
    '<div class="ctitle">' + esc(it.title || 'Untitled') + '</div>' +
    '<div class="cmeta">' + meta + '</div></div>';
}
function headHTML(col) {
  const ids = plan.cols[col];
  if (col === 'backlog') {
    const open = searchOpen || !!query;
    return '<div class="col-head"><div class="col-title">All items <span class="count">' + ids.length + '</span>' +
      '<span class="search">' + (open ? '<input id="search" class="search-in" placeholder="Search all items" value="' + esc(query) + '">' : '') +
      '<button class="icon-btn' + (open ? ' on' : '') + '" id="searchBtn" title="' + (open ? 'Close search' : 'Search') + '" aria-label="' + (open ? 'Close search' : 'Search') + '">' +
      (open ? ICON.close : ICON.search) + '</button></span></div>' +
      '<div class="col-sub">Not planned into a sprint yet</div></div>' +
      '<div class="quick"><input id="quickAdd" placeholder="Add an item"' + (loaded ? '' : ' disabled') + '>' +
      '<button class="primary" id="quickAddBtn"' + (loaded ? '' : ' disabled') + '>Add</button></div>';
  }
  const s = SPRINTS.find((x) => x.id === col);
  const mix = PRIORITIES.map((p) => {
    const n = ids.filter((id) => plan.items[id].priority === p.id).length;
    return n ? '<span class="t-' + p.id + '">' + n + ' ' + p.label + '</span>' : '';
  }).join('');
  return '<div class="col-head"><div class="col-title">' + s.name + ' <span class="count">' + ids.length + '</span>' +
    (s.note ? '<span class="badge">' + s.note + '</span>' : '') + '</div>' +
    '<div class="col-sub">' + range(s) + ' &middot; ' + sprintStatus(s).text + '</div>' +
    (mix ? '<div class="mix">' + mix + '</div>' : '') + '</div>';
}
// "All items" always lists V High first, then High, Med, Low, then no priority; within a priority the
// saved order is kept. Sprint columns keep their dragged order.
const PRI_RANK = { vhigh: 0, high: 1, med: 2, low: 3 };
const rank = (id) => (plan.items[id].priority in PRI_RANK ? PRI_RANK[plan.items[id].priority] : 4);
function shownOrder(col) {
  const ids = plan.cols[col];
  if (col !== 'backlog') return ids;
  return ids.map((id, i) => [id, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
}
function spanLabel(it) {
  if (!it.start) return '';
  const a = d(it.start), b = d(it.end || it.start);
  if (it.start === it.end) return fmtDay(a);
  return a.getMonth() === b.getMonth() ? a.getDate() + ' to ' + fmt(b) : fmt(a) + ' to ' + fmt(b);
}
function matches(it) {
  if (!query) return true;
  return (it.title + ' ' + it.description + ' ' + it.assignees.join(' ') + ' #' + it.num).toLowerCase().includes(query.toLowerCase());
}
function renderBoard() {
  if (dragging) return;
  const board = $('boardEl');
  const active = document.activeElement;
  const focused = active && (active.id === 'search' || active.id === 'quickAdd') ? active.id : null;
  const caret = focused ? active.selectionStart : null;
  const quickVal = $('quickAdd') ? $('quickAdd').value : '';
  const scrolls = Array.from(board.querySelectorAll('.list')).map((l) => l.scrollTop);
  board.innerHTML = COLS.map((col) => {
    const ids = plan.cols[col];
    const empty = ids.length ? '' : '<div class="empty">' + (col === 'backlog' ? (loaded ? 'No items yet. Add one above.' : 'Loading...') : 'Drag items here') + '</div>';
    return '<div class="col" data-col="' + col + '">' + headHTML(col) +
      '<div class="list" data-col="' + col + '">' + shownOrder(col).map((id) => cardHTML(plan.items[id], col)).join('') + empty + '</div></div>';
  }).join('');
  board.querySelectorAll('.list').forEach((l, i) => { l.scrollTop = scrolls[i] || 0; });
  $('quickAdd').value = quickVal;

}
function bindBoard() {
  document.querySelectorAll('.list').forEach((list) => {
    if (!window.Sortable) return;
    Sortable.create(list, {
      group: 'items', animation: 150, filter: '.empty, .cact', preventOnFilter: false, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
      forceFallback: true, fallbackTolerance: 4, scroll: true, bubbleScroll: true,
      disabled: !loaded,
      onStart: () => { dragging = true; },
      onEnd: (evt) => {
        dragging = false;
        dragEnded = Date.now();
        const el = evt.item;
        let next = el.nextElementSibling;
        while (next && !next.classList.contains('card')) next = next.nextElementSibling;
        const to = evt.to.dataset.col;
        const from = evt.from.dataset.col;
        if (to === from && evt.oldIndex === evt.newIndex) { renderBoard(); return; }
        commit({ type: 'move', id: el.dataset.id, to, before: next ? next.dataset.id : null });
      },
    });
  });
  document.querySelectorAll('.card').forEach((c) => {
    c.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (act) {
        e.stopPropagation();
        if (act.dataset.act === 'edit') openItem(c.dataset.id); else deleteItem(c.dataset.id);
        return;
      }
      if (Date.now() - dragEnded > 200) openItem(c.dataset.id);
    });
  });
  const qa = $('quickAdd');
  const addQuick = () => {
    const title = qa.value.trim();
    if (!title) { qa.focus(); return; }
    qa.value = '';
    commit({ type: 'add', id: newId(), title });
    $('quickAdd').focus();
  };
  qa.addEventListener('keydown', (e) => { if (e.key === 'Enter') addQuick(); });
  $('quickAddBtn').addEventListener('click', addQuick);
  $('searchBtn').addEventListener('click', () => {
    if (searchOpen || query) { searchOpen = false; query = ''; renderBoard(); }
    else { searchOpen = true; renderBoard(); $('search').focus(); }
  });
  const si = $('search');
  if (si) {
    si.addEventListener('input', (e) => { query = e.target.value; renderBoard(); });
    si.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); searchOpen = false; query = ''; renderBoard(); } });
  }
}
let dragEnded = 0;

// ---------- drawer ----------
$('fCol').innerHTML = '<option value="backlog">Not planned</option>' + SPRINTS.map((s) => '<option value="' + s.id + '">' + s.name + ' (' + range(s) + ')</option>').join('');
$('fPri').innerHTML = '<option value="">None</option>' + PRIORITIES.map((p) => '<option value="' + p.id + '">' + p.label + '</option>').join('');

const cur = () => (openId ? plan.items[openId] : null);
function fitTitle() {
  const t = $('fTitle');
  if ($('drawer').hidden) return;
  t.style.height = 'auto';
  t.style.height = (t.scrollHeight + t.offsetHeight - t.clientHeight) + 'px';
}

// Title and description save after a short pause in typing.
const textTimers = {};
function pendingText() { return Object.keys(textTimers).length > 0; }
function queueText(field, value) {
  const id = openId;
  plan.items[id][field] = value;
  clearTimeout(textTimers[field]);
  textTimers[field] = setTimeout(() => {
    delete textTimers[field];
    if (plan.items[id]) commit({ type: 'update', id, fields: { [field]: value } });
  }, 700);
}
function flushText() {
  for (const field of Object.keys(textTimers)) {
    clearTimeout(textTimers[field]);
    delete textTimers[field];
    const it = cur();
    if (it) commit({ type: 'update', id: it.id, fields: { [field]: it[field] } });
  }
}

function openItem(id) {
  flushText();
  openId = id;
  $('fComment').value = ''; $('fLinkName').value = ''; $('fLinkUrl').value = ''; $('fAssigneeIn').value = '';
  $('fMe').value = me;
  fillDrawer(true);
  $('drawer').hidden = false; $('scrim').hidden = false;
  fitTitle();
}
function dateOptions(col, it) {
  const s = SPRINTS.find((x) => x.id === col);
  for (const [id, which, none] of [['fStart', 'start', 'No dates'], ['fEnd', 'end', 'No dates']]) {
    const sel = $(id);
    sel.innerHTML = s ? '<option value="">' + none + '</option>' + sprintDays(s).map((dt) => '<option value="' + iso(dt) + '">' + fmtDay(dt) + '</option>').join('')
      : '<option value="">Pick a sprint first</option>';
    sel.disabled = !s;
    sel.value = s ? it[which] || '' : '';
  }
}
function fillDrawer(all) {
  const it = cur();
  if (!it) return;
  const set = (el, v) => { if (all || document.activeElement !== el) el.value = v; };
  $('drId').textContent = '#' + it.num;
  if (!textTimers.title) set($('fTitle'), it.title);
  if (!textTimers.description) set($('fDesc'), it.description);
  set($('fCol'), colOf(plan, it.id) || 'backlog');

}

function deleteItem(id) {

// ---------- calendar ----------
// Each sprint is a Gantt chart over its seven days: an item with dates is a bar from its start to its end.
// Drag a bar to move it (onto another sprint too), drag its left or right edge to change the start or
// the end. Cards in "No dates yet" or "Not planned" are dragged onto a day to place them (one day long
// at first). Dropping a bar on "No dates yet" clears its dates; on "Not planned" it leaves the sprints.
function ccardHTML(it, showPri) {
  const p = showPri && it.priority ? PRI_BY[it.priority] : null;
  return '<div class="ccard' + (p ? ' p-' + p.id : '') + '" data-id="' + it.id + '" title="' + esc(it.title || 'Untitled') + '">' +
    '<div class="ctop"><span>#' + it.num + '</span>' + (p ? '<span class="ptag t-' + p.id + '">' + p.label + '</span>' : '') + '</div>' +
    '<div class="ct">' + esc(it.title || 'Untitled') + '</div></div>';
}
const dayIndex = (s, key) => Math.round((d(key) - d(s.start)) / 86400000);
function barHTML(it, s, row) {
  const p = it.priority ? PRI_BY[it.priority] : null;
  const a = dayIndex(s, it.start), b = dayIndex(s, it.end);
  return '<div class="gbar' + (p ? ' p-' + p.id : '') + '" data-id="' + it.id + '" style="grid-column:' + (a + 1) + ' / ' + (b + 2) + ';grid-row:' + row + '"' +
    ' title="' + esc('#' + it.num + ' ' + (it.title || 'Untitled') + ' · ' + spanLabel(it)) + '">' +
    '<span class="grip l" data-grip="start"></span><span class="bid">#' + it.num + '</span><span class="bt">' + esc(it.title || 'Untitled') + '</span>' +
    (p ? '<span class="ptag t-' + p.id + '">' + p.label + '</span>' : '') + '<span class="grip r" data-grip="end"></span></div>';
}
function renderCalendar() {
  if (dragging) return;
  const t = today();
  const wrap = $('calEl');
  const scrolls = Array.from(wrap.querySelectorAll('.wscroll')).map((w) => w.scrollLeft);
  let html = '<div class="cal-hint">Drag a bar to move it, drag its edges to change the start or end date. Drag cards from "No dates yet" onto a day to place them.</div>';
  for (const s of SPRINTS) {
    const items = plan.cols[s.id].map((id) => plan.items[id]);
    const dated = items.filter((it) => it.start).sort((x, y) => (x.start < y.start ? -1 : x.start > y.start ? 1 : x.end < y.end ? -1 : x.end > y.end ? 1 : 0));
    const undated = items.filter((it) => !it.start);
    const days = sprintDays(s);
    const heads = days.map((dt) => {
      const key = iso(dt), isToday = +dt === +t, isEnd = key === s.end;
      return '<div class="dhead' + (dt.getDay() === 0 || dt.getDay() === 6 ? ' weekend' : '') + (isToday ? ' today' : '') + '"><div class="dn">' + DAY[dt.getDay()] + '</div><div class="dd">' + fmt(dt) + '</div>' +
        '<div class="flags">' + (isEnd ? '<span class="flag">Delivery</span>' : '') + (isToday ? '<span class="flag now">Today</span>' : '') + '</div></div>';
    }).join('');
    const bg = days.map((dt, i) => '<div class="gbg' + (dt.getDay() === 0 || dt.getDay() === 6 ? ' weekend' : '') + (+dt === +t ? ' today' : '') +
      '" style="left:' + (i * 100 / 7) + '%;width:' + (100 / 7) + '%"></div>').join('');
    const bars = dated.length ? dated.map((it, i) => barHTML(it, s, i + 1)).join('') : '<div class="gempty">No dated items yet. Drag a card onto a day.</div>';
    html += '<div class="week"><div class="week-head"><span class="name">' + s.name + '</span>' +
      (s.note ? '<span class="badge">' + s.note + '</span>' : '') +
      '<span class="sub">' + range(s) + ' &middot; Delivers ' + fmtDay(d(s.end)) + ' &middot; ' + sprintStatus(s).text + ' &middot; ' +
      items.length + (items.length === 1 ? ' item' : ' items') + '</span></div>' +
      '<div class="wscroll"><div class="gwrap"><div class="ghead">' + heads + '</div>' +
      '<div class="gantt" data-col="' + s.id + '">' + bg + bars + '</div></div></div>' +
      '<div class="noday"><span class="lbl2">No dates yet</span><div class="strip" data-col="' + s.id + '" data-empty="' +
      (items.length ? 'Every item in this sprint has dates.' : 'Nothing planned for this sprint yet.') + '">' +
      undated.map((it) => ccardHTML(it, true)).join('') + '</div></div></div>';
  }
  const back = shownOrder('backlog').map((id) => plan.items[id]);
  html += '<div class="week unplanned"><div class="week-head"><span class="name">Not planned</span><span class="sub">' +
    back.length + (back.length === 1 ? ' item' : ' items') + ' without a sprint. Drag one onto a day to plan it.</span></div>' +
    '<div class="strip" data-col="backlog" data-empty="Every item is in a sprint.">' + back.map((it) => ccardHTML(it, true)).join('') + '</div></div>';
  wrap.innerHTML = html;
  wrap.querySelectorAll('.wscroll').forEach((w, i) => { w.scrollLeft = scrolls[i] || 0; });
  wrap.querySelectorAll('.gbar, .ccard').forEach((el) => el.addEventListener('pointerdown', ganttDown));
}

// One drag at a time. g = {id, mode: 'move' | 'start' | 'end' | 'place', el, x0, y0, moved, grab, target}
let g = null;
function ganttDown(e) {
  if (e.button !== 0 || !loaded) return;
  const el = e.currentTarget;
  const id = el.dataset.id, it = plan.items[id];
  const grip = e.target.closest('[data-grip]');
  const mode = el.classList.contains('ccard') ? 'place' : grip ? grip.dataset.grip : 'move';
  let grab = 0;
  if (mode === 'move') {
    const s = SPRINTS.find((x) => x.id === colOf(plan, id));
    const hit = ganttAt(e.clientX, e.clientY);
    grab = hit && hit.col === s.id ? hit.day - dayIndex(s, it.start) : 0;
  }
  g = { id, mode, el, x0: e.clientX, y0: e.clientY, moved: false, grab, target: null };
  document.addEventListener('pointermove', ganttMove);
  document.addEventListener('pointerup', ganttUp);
  document.addEventListener('pointercancel', ganttCancel);
  e.preventDefault();
}
// The sprint chart and day under a point, or null.
function ganttAt(x, y) {
  for (const gt of document.querySelectorAll('#calEl .gantt')) {
    const r = gt.getBoundingClientRect();
    if (y >= r.top - 4 && y <= r.bottom + 4 && x >= r.left && x <= r.right) {
      return { col: gt.dataset.col, el: gt, day: Math.max(0, Math.min(6, Math.floor((x - r.left) / (r.width / 7)))) };
    }
  }
  return null;
}
function stripAt(x, y) {
  for (const st of document.querySelectorAll('#calEl .strip')) {
    const r = st.getBoundingClientRect();
    if (y >= r.top && y <= r.bottom && x >= r.left && x <= r.right) return st;
  }
  return null;
}
function clearPreview() {
  document.querySelectorAll('#calEl .gbar.preview, .gfloat').forEach((x) => x.remove());
  document.querySelectorAll('#calEl .over').forEach((x) => x.classList.remove('over'));
}
function ganttMove(e) {
  if (!g) return;
  if (!g.moved) {
    if (Math.abs(e.clientX - g.x0) + Math.abs(e.clientY - g.y0) < 5) return;
    g.moved = true; dragging = true; g.el.classList.add('lifted');
  }
  const it = plan.items[g.id];
  const cur = colOf(plan, g.id);
  clearPreview();
  g.target = null;
  const hit = ganttAt(e.clientX, e.clientY);
  if (hit && (g.mode === 'move' || g.mode === 'place' || hit.col === cur)) {
    const s = SPRINTS.find((x) => x.id === hit.col);
    let a, b;
    if (g.mode === 'place') { a = b = hit.day; }
    else if (g.mode === 'move') {
      const sOld = SPRINTS.find((x) => x.id === cur);
      const len = dayIndex(sOld, it.end) - dayIndex(sOld, it.start);
      a = Math.max(0, Math.min(6 - len, hit.day - g.grab)); b = a + len;
    } else {
      const sCur = SPRINTS.find((x) => x.id === cur);
      a = dayIndex(sCur, it.start); b = dayIndex(sCur, it.end);
      if (g.mode === 'start') a = Math.min(hit.day, b); else b = Math.max(hit.day, a);
    }
    const days = sprintDays(s);
    g.target = { kind: 'dates', col: hit.col, start: iso(days[a]), end: iso(days[b]) };
    const pv = document.createElement('div');
    pv.className = 'gbar preview' + (it.priority ? ' p-' + it.priority : '');
    pv.style.gridColumn = (a + 1) + ' / ' + (b + 2);
    pv.style.gridRow = '1';
    pv.innerHTML = '<span class="bid">#' + it.num + '</span><span class="bt">' + esc(it.title || 'Untitled') + '</span>';
    pv.title = '';
    hit.el.appendChild(pv);
    hit.el.classList.add('over');
    const f = floatLabel(e, a === b ? fmtDay(days[a]) : fmt(days[a]) + ' to ' + fmt(days[b]));
    f.style.borderColor = 'var(--accent)';
  } else {
    const st = g.mode === 'move' || g.mode === 'place' ? stripAt(e.clientX, e.clientY) : null;
    if (st) {
      g.target = { kind: st.dataset.col === 'backlog' ? 'backlog' : 'nodates', col: st.dataset.col };
      st.classList.add('over');
    }
    floatLabel(e, st ? (st.dataset.col === 'backlog' ? 'Not planned' : 'No dates yet') : '#' + it.num + ' ' + (it.title || 'Untitled'));
  }
  autoScroll(e.clientY);
}
function floatLabel(e, text) {
  const f = document.createElement('div');
  f.className = 'gfloat';
  f.textContent = text;
  f.style.left = (e.clientX + 14) + 'px';
  f.style.top = (e.clientY + 14) + 'px';
  document.body.appendChild(f);
  return f;
}
function autoScroll(y) {
  const box = document.querySelector('#calendar .cal-wrap');
  const r = box.getBoundingClientRect();
  if (y < r.top + 40) box.scrollTop -= 14; else if (y > r.bottom - 40) box.scrollTop += 14;
}
function ganttEnd() {
  document.removeEventListener('pointermove', ganttMove);
  document.removeEventListener('pointerup', ganttUp);
  document.removeEventListener('pointercancel', ganttCancel);
  clearPreview();
  dragging = false;
}
function ganttCancel() { ganttEnd(); g = null; renderCalendar(); }
function ganttUp() {
  const drag = g;
  ganttEnd();
  g = null;
  if (!drag) return;
  if (!drag.moved) { openItem(drag.id); return; }
  dragEnded = Date.now();
  const it = plan.items[drag.id], cur = colOf(plan, drag.id), tg = drag.target;
  if (!tg) { renderCalendar(); return; }
  if (tg.kind === 'dates') {
    if (tg.col === cur) {
      if (tg.start === it.start && tg.end === it.end) { renderCalendar(); return; }
      commit({ type: 'update', id: drag.id, fields: { start: tg.start, end: tg.end } });
    } else commit({ type: 'move', id: drag.id, to: tg.col, before: null, start: tg.start, end: tg.end });
  } else if (tg.kind === 'nodates') {
    if (tg.col === cur) {
      if (!it.start) { renderCalendar(); return; }
      commit({ type: 'update', id: drag.id, fields: { start: '', end: '' } });
    } else commit({ type: 'move', id: drag.id, to: tg.col, before: null, start: '', end: '' });
  } else if (tg.kind === 'backlog') {
    if (cur === 'backlog') { renderCalendar(); return; }
    commit({ type: 'move', id: drag.id, to: 'backlog', before: null });
  }
}

function renderAll() {
  if ($('calendar').hidden) renderBoard(); else renderCalendar();
  if (openId) {
    if (!plan.items[openId]) { openId = null; $('drawer').hidden = true; $('scrim').hidden = true; toast('That item was deleted.'); }
    else fillDrawer(false);
  }
}
function route() {
  const v = location.hash === '#calendar' ? 'calendar' : 'board';
  $('board').hidden = v !== 'board';
  $('calendar').hidden = v !== 'calendar';
  document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.view === v));
  renderAll();
}
window.addEventListener('hashchange', route);

$('newBtn').addEventListener('click', () => {
  if (location.hash === '#calendar') location.hash = '#board';
  const id = newId();
  if (commit({ type: 'add', id, title: '' })) { openItem(id); $('fTitle').focus(); }
});
$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(plan, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const t = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = 'sprint-plan-' + t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

if (!window.Sortable) toast('Drag and drop could not load. Use the Sprint field inside an item to move it.');
route();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
